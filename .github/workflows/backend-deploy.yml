# Required GitHub Secrets:
# DOCKERHUB_TOKEN
# KUBE_HOST
# KUBE_TOKEN
# TS_OAUTH_CLIENT_ID
# TS_OAUTH_SECRET
# SERVICE_ACCOUNT_KEY_ENCODED

# Required Github Variables:
# DOCKERHUB_USERNAME
# DOCKERHUB_REPO
# KUBE_DEPLOYMENT_NAME
# KUBE_NAMESPACE


name: backend-cicd
on:
  push:
    branches: main

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Add Firebase serviceAccountKey.json
        run: |
          cd backend/app
          echo "${{ secrets.SERVICE_ACCOUNT_KEY_ENCODED }}" > serviceAccountKey_base64.txt
          base64 -d serviceAccountKey_base64.txt > serviceAccountKey.json

      - name: Build and push Docker image
        run: |
          cd backend
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
